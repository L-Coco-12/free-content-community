spring:
  application:
    name: free-content-community

  datasource:
    url: jdbc:mysql://127.0.0.1:${MYSQL_PORT:3307}/${MYSQL_DATABASE:free_content}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true
    username: ${MYSQL_USER:app}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD}
      timeout: 3s
      connect-timeout: 3s

  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:app}
    password: ${RABBITMQ_PASSWORD}
    connection-timeout: 5s

  mail:
    host: ${MAIL_HOST:127.0.0.1}
    port: ${MAIL_PORT:1025}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
      mail.smtp.connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT_MILLIS:3000}
      mail.smtp.timeout: ${MAIL_SMTP_READ_TIMEOUT_MILLIS:5000}
      mail.smtp.writetimeout: ${MAIL_SMTP_WRITE_TIMEOUT_MILLIS:5000}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    time-zone: UTC
    # 契约要求拒绝未定义字段；同时不要全局忽略 null，
    # 因为 nextCursor 等字段在契约中是 required + nullable。
    deserialization:
      fail-on-unknown-properties: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      # 契约为不透明字符串 ID，使用 32 位 UUID 字符串，避免 Long 被前端当 Number
      id-type: assign_uuid

